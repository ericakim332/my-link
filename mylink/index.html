<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siyeon's MyLink ♡</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 70px 20px;
      background: linear-gradient(135deg, #fff1f6, #f8dfeb);
      font-family: Arial, sans-serif;
      text-align: center;
      color: #603b50;
    }

    .container {
      max-width: 400px;
      margin: auto;
    }

    .profile {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #e8b9cf;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }

    h1 { margin: 22px 0 10px; }

    .intro {
      color: #987287;
      margin-bottom: 35px;
    }

    .link {
      display: block;
      padding: 18px;
      margin: 14px 0;
      border-radius: 15px;
      background: white;
      color: #603b50;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 12px #e9cbd9;
      transition: transform 0.2s;
    }

    .link:hover {
      transform: translateY(-3px);
      background: #ffe6ef;
    }

    footer {
      margin-top: 45px;
      font-size: 13px;
      color: #ad8999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile">♡</div>

    <h1>시연's MyLink </h1>
    <p class="intro">Welcome to my little space!</p>

    <a class="link"
       href="https://github.com/ericakim332"
       target="_blank" rel="noopener noreferrer">
       GitHub ♡
    </a>

    <a class="link"
       href="https://hyletterheart.netlify.app"
       target="_blank" rel="noopener noreferrer">
       My Website ♡
    </a>

    <footer>Made with by Siyeon </footer>
  </div>
</body>
</html>
