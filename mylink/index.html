<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siyeon's MyLink</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 75px 20px;
      background: linear-gradient(180deg, #f8f9fa 0%, #eceff2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      text-align: center;
      color: #1d1d1f;
    }

    .container {
      max-width: 380px;
      margin: auto;
    }

    /* 프로필 아이콘 */
    .profile {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #1d1d1f;
      transition: transform 0.25s ease;
    }

    .profile:hover {
      transform: scale(1.05);
    }

    h1 {
      margin: 20px 0 6px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: #111827;
    }

    .intro {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 34px;
      letter-spacing: -0.2px;
    }

    /* 링크 버튼 */
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 18px 20px;
      border-radius: 14px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      color: #1f2937;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .link:hover {
      transform: translateY(-2px);
      background: #111827;
      color: #ffffff;
      border-color: #111827;
      box-shadow: 0 8px 20px rgba(17, 24, 39, 0.15);
    }

    .link:active {
      transform: translateY(0);
    }

    footer {
      margin-top: 50px;
      font-size: 12px;
      color: #9ca3af;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile">✦</div>

    <h1>시연's MyLink</h1>
    <p class="intro">Welcome to my space</p>

    <div class="link-list">
      <a class="link"
         href="https://music.apple.com/kr/playlist/c/pl.u-06oxpzbCYdeGMmG"
         target="_blank" rel="noopener noreferrer">
         <span>Music ♫</span>
      </a>

      <a class="link"
         href="https://github.com/ericakim332"
         target="_blank" rel="noopener noreferrer">
         <span>GitHub</span>
      </a>
    </div>

    <footer>Made by Siyeon</footer>
  </div>
</body>
</html>
